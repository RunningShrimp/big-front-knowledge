<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%A7%AD%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>错题本 · 前端领航员</title>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<!-- 本页自绘头部（含返回地图链接）；壳层自动初始化仅针对 body[data-page] 的知识点页 -->
<header class="fg-header">
  <div class="fg-crumb">
    <a href="index.html">学习地图</a>
    <span class="fg-crumb-sep">/</span>
    <strong>错题本</strong>
  </div>
  <div class="fg-header-nav"><span id="sound-slot"></span></div>
</header>

<main class="fg-container">
  <p class="fg-subtitle">答错的题会自动收进这里，3 天后可重测；重测通过自动移出，未通过则重新计时 3 天。</p>
  <div id="fg-wrongbook"></div>
</main>

<footer class="fg-footer">
  <p>前端领航员 · 纯静态本地学习站 —— 无网络请求，数据仅存于本机浏览器 localStorage。</p>
</footer>

<!-- 脚本加载顺序：curriculum.js → progress-store.js → quiz-engine.js → site.js → 页面内联脚本 -->
<script src="assets/data/curriculum.js"></script>
<script src="assets/js/progress-store.js"></script>
<script src="assets/js/quiz-engine.js"></script>
<script src="assets/js/site.js"></script>
<script>
/* 错题本渲染与重测逻辑（页面内联脚本） */
(function () {
  'use strict';
  var DAY = 24 * 60 * 60 * 1000;
  var LETTERS = 'ABCDEFGH';
  var esc = window.FG ? FG.esc : function (s) { return String(s); };

  /* 轻提示 */
  var toastEl = null;
  var toastTimer = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'fg-toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-show'); }, 2400);
  }

  function typeText(t) {
    return t === 'code' ? '代码题' : (t === 'multi' ? '多选' : '单选');
  }

  function render() {
    var host = document.getElementById('fg-wrongbook');
    host.innerHTML = '';
    var list = ProgressStore.wrongList();

    /* 课程数据缺失容错：curriculum.js 暂缺时给出提示，错题数据仍可查看（标题降级为编号） */
    if (!window.CURRICULUM) {
      var tip = document.createElement('div');
      tip.className = 'fg-card fg-notice';
      tip.textContent = '课程数据（assets/data/curriculum.js）尚未生成或加载失败，知识点标题暂时显示为编号；错题数据保存在本机，不受影响。';
      host.appendChild(tip);
    }
    if (!list.length) {
      host.innerHTML =
        '<div class="fg-card fg-empty">' +
        '<h2>错题本是空的</h2>' +
        '<p>在各知识点页做题时答错会自动收进这里，3 天后提醒你重测。</p>' +
        '<p><a class="fg-btn fg-btn--primary" href="index.html">去学习地图挑一个知识点</a></p>' +
        '</div>';
      return;
    }

    /* 按知识点（pageId）分组，保持错题时间倒序 */
    var groups = {};
    var order = [];
    list.forEach(function (w) {
      if (!groups[w.pageId]) {
        groups[w.pageId] = [];
        order.push(w.pageId);
      }
      groups[w.pageId].push(w);
    });

    order.forEach(function (pid) {
      var found = window.FG ? FG.findPoint(pid) : null;
      var title = (found && found.point && found.point.title) ? found.point.title : pid;
      var groupName = (found && found.module && found.module.name)
        ? (found.module.name + ' · ' + title) : title;

      var sec = document.createElement('section');
      sec.className = 'fg-card fg-wrong-group';
      sec.innerHTML = '<h2 class="fg-wrong-group-title">' + esc(groupName) +
        '<span class="fg-badge fg-badge--muted">' + groups[pid].length + ' 题</span></h2>';
      groups[pid].forEach(function (w) { sec.appendChild(renderItem(w)); });
      host.appendChild(sec);
    });
  }

  /* 渲染单条错题：题干 / 选项 / 正确答案 / 解析 + 重测控制 */
  function renderItem(w) {
    var now = Date.now();
    var card = document.createElement('article');
    card.className = 'fg-wrong-item quiz-item';

    var html = '<div class="quiz-stem"><span class="quiz-type-badge">' +
      typeText(w.type) + '</span>' + esc(w.stem) + '</div>';

    if (w.type === 'code') {
      /* 代码题：answer 存参考实现，explain 存逐条断言（换行分隔） */
      html += '<div class="fg-wrong-answer"><span class="fg-wrong-answer-label">参考实现</span>' +
        '<pre class="quiz-reference"><code>' + esc(w.answer || '') + '</code></pre></div>';
      html += '<div class="fg-wrong-answer"><span class="fg-wrong-answer-label">需满足的断言</span>' +
        '<pre class="quiz-reference"><code>' + esc(w.explain || '') + '</code></pre></div>';
    } else {
      if (w.options && w.options.length) {
        html += '<div class="quiz-options">';
        (w.options || []).forEach(function (opt, i) {
          var isAns = Array.isArray(w.answer) && w.answer.indexOf(i) >= 0;
          html += '<div class="quiz-option' + (isAns ? ' is-right' : '') + '">' +
            '<span class="quiz-option-key">' + (LETTERS[i] || i) + '.</span>' +
            '<span class="quiz-option-text">' + esc(opt) + '</span>' +
            (isAns ? '<span class="fg-badge fg-badge--ok fg-badge--sm">正确答案</span>' : '') +
            '</div>';
        });
        html += '</div>';
      }
      html += '<div class="quiz-explain quiz-explain--ok">' +
        '<div class="quiz-explain-title">解析</div>' +
        '<div class="quiz-explain-body">' + esc(w.explain || '') + '</div></div>';
    }
    card.innerHTML = html;

    /* 重测控制：nextRetryAt 未到则禁用并显示「x 天后可重测」 */
    var foot = document.createElement('div');
    foot.className = 'fg-wrong-foot';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'fg-btn fg-btn--primary fg-btn--sm';
    var box = document.createElement('div');
    box.className = 'fg-retest-box';

    if (!w.nextRetryAt || now >= w.nextRetryAt) {
      btn.textContent = '重测';
      btn.addEventListener('click', function () { startRetest(w, box, btn); });
    } else {
      var days = Math.max(1, Math.ceil((w.nextRetryAt - now) / DAY));
      btn.disabled = true;
      btn.textContent = days + ' 天后可重测';
    }
    foot.appendChild(btn);
    foot.appendChild(box);
    card.appendChild(foot);
    return card;
  }

  /* 到期重测：选择类直接重新判题；代码类重新进沙箱；通过则自动移出错题本 */
  function startRetest(w, box, btn) {
    btn.disabled = true;
    var q;
    if (w.type === 'code') {
      q = {
        id: w.qid,
        type: 'code',
        stem: '（重测）' + w.stem,
        stub: '// 请重新实现，使其满足下方断言：\n',
        reference: w.answer || '',
        asserts: String(w.explain || '').split('\n').filter(function (s) { return s.trim(); })
      };
    } else {
      q = {
        id: w.qid,
        type: w.type,
        stem: '（重测）' + w.stem,
        options: w.options || [],
        answer: w.answer || [],
        explain: w.explain || ''
      };
    }
    var r = QuizEngine.mount(box, [q], { pageId: w.pageId, mode: 'retest' });
    r.whenReady(function (res) {
      if (res.total > 0 && res.score === res.total) {
        ProgressStore.removeWrong(w.qid);
        toast('重测通过，已从错题本移出');
      } else {
        toast('这次还没全对，错题继续保留，3 天后可再次重测');
      }
      render();
    });
  }

  /* ---------- 启动 ---------- */
  render();
  var slot = document.getElementById('sound-slot');
  if (slot && window.FG) slot.appendChild(FG.sound.button());
})();
</script>
</body>
</html>
